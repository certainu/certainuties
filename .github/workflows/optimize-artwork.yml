name: Optimize CERTAINU artwork
on:
  push:
    branches: [refactor/site-reliability-20261008]
    paths:
      - scripts/optimize_images.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/site-reliability-20261008
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/optimize_images.py
      - name: Commit optimized image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/certainu-08.png assets/certainu-08.webp
          if ! git diff --cached --quiet; then
            git commit -m "Optimize CERTAINU artwork as WebP"
            git push origin HEAD:refactor/site-reliability-20261008
          fi
