name: Validate CERTAINU site
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate prediction data
        run: python scripts/validate_predictions.py
      - name: Check JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Check local asset references
        run: python scripts/validate_site_assets.py
      - name: Verify script loading order
        run: python scripts/check_script_order.py
      - name: Install browser test tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test site in desktop and mobile Chromium
        run: python tests/test_browser.py
