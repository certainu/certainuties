name: Add 3 Quick Predictions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-three:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add exactly 3 <=24h predictions
        run: python scripts/add_three_quick_predictions_once.py

      - name: Commit predictions
        run: |
          if git diff --quiet -- data/predictions.json; then
            echo "No prediction changes to commit."
            exit 0
          fi
          git config user.name "CERTAINU Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/predictions.json
          git commit -m "Add 3 one-time quick CERTAINU predictions"
          git push
