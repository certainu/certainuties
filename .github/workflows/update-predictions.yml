name: Update CERTAINU Predictions

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh Polymarket data and CERTAINU calls
        run: python scripts/update_predictions.py
      - name: Commit feed changes
        run: |
          git config user.name "CERTAINU Bot"
          git config user.email "actions@github.com"
          git add data/predictions.json
          git diff --cached --quiet || git commit -m "Update CERTAINU predictions"
          git push
