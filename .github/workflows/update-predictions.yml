name: Update CERTAINU Predictions

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh Polymarket data and add a new CERTAINU call
        env:
          CERTAINU_MAX_OPEN: '1000'
          CERTAINU_MAX_NEW_PER_RUN: '1'
          CERTAINU_MAX_VISIBLE: '50'
          CERTAINU_MAX_LONG_OPEN: '6'
          CERTAINU_MIN_EDGE: '0'
          CERTAINU_MIN_VOLUME: '5000'
        run: python scripts/update_predictions.py
      - name: Apply CERTAINUTIES resolution categories
        run: python scripts/patch_prediction_categories.py
      - name: Commit feed and site changes
        run: |
          git config user.name "CERTAINU Bot"
          git config user.email "actions@github.com"
          git add data/predictions.json index.html
          git diff --cached --quiet || git commit -m "Update CERTAINU predictions"
          git push
