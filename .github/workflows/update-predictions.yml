name: Update CERTAINU Predictions

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Seed labeled pre-live resolved calls
        run: python scripts/seed_pre_live_calls.py
      - name: Refresh Polymarket data and add a new CERTAINU call
        env:
          CERTAINU_MAX_OPEN: '100'
          CERTAINU_MAX_RESOLVED: '1000'
          CERTAINU_MAX_NEW_PER_RUN: '1'
          CERTAINU_MAX_VISIBLE: '1100'
          CERTAINU_MAX_LONG_OPEN: '6'
          CERTAINU_MAX_CRYPTO_OPEN: '24'
          CERTAINU_CRYPTO_BONUS: '6'
          CERTAINU_MIN_EDGE: '0'
          CERTAINU_MIN_VOLUME: '5000'
        run: python scripts/update_predictions.py
      - name: Validate generated prediction data
        run: python scripts/validate_predictions.py
      - name: Commit prediction data only
        run: |
          git config user.name "CERTAINU Bot"
          git config user.email "actions@github.com"
          git add data/predictions.json
          git diff --cached --quiet || git commit -m "Update CERTAINU predictions"
          git push
